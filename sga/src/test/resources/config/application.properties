# Propiedades de las pruebas. Spring Boot lee este archivo después de application.properties y solo cambia lo
# que está aquí: las pruebas usan H2 en memoria y nunca tocan la base en archivo ./data/sga.
spring.datasource.url=jdbc:h2:mem:sga-pruebas

# Las fotos subidas en las pruebas van al almacén local, dentro de build/ y nunca en ./data/imagenes
sga.imagenes.proveedor=local
sga.imagenes.local.directorio=build/imagenes-pruebas
