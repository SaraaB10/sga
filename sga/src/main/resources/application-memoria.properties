# Perfil "memoria": la base H2 vive en memoria y empieza en limpio en cada arranque, con los datos iniciales.
# Arranque: ./gradlew bootRun --args='--spring.profiles.active=memoria'
# Sin este perfil la base se guarda en el archivo ./data/sga (application.properties).

spring.datasource.url=jdbc:h2:mem:sgadb
