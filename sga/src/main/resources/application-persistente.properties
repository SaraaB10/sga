# Perfil "persistente": la base H2 se guarda en un archivo y los datos sobreviven a los reinicios.
# Arranque: ./gradlew bootRun --args='--spring.profiles.active=persistente'
# El perfil por defecto y las pruebas siguen con H2 en memoria (application.properties).

# --- Base de datos H2 en archivo ---
# Ruta relativa a la carpeta desde donde arranca la app (sga/ con bootRun): queda en sga/data/sga.mv.db,
# que no se sube al repositorio. Para empezar de cero, se detiene la app y se borra esa carpeta.
spring.datasource.url=jdbc:h2:file:./data/sga

# --- JPA ---
# update crea las tablas la primera vez y en los siguientes arranques conserva los datos
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
