# Herramientas de desarrollo apagadas en internet
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false

# Secreto y CORS desde variables de entorno
sga.cors.origenes-permitidos=${SGA_CORS_ALLOWED_ORIGINS}
sga.jwt.secret=${SGA_JWT_SECRET}


# Cuenta inicial: solo un administrador, con datos que no están en el repositorio
sga.usuarios-iniciales.usuarios[0].nombre=Administrador SGA
sga.usuarios-iniciales.usuarios[0].correo=${SGA_ADMIN_CORREO}
sga.usuarios-iniciales.usuarios[0].contrasena=${SGA_ADMIN_CONTRASENA}
sga.usuarios-iniciales.usuarios[0].telefono=${SGA_ADMIN_TELEFONO}
sga.usuarios-iniciales.usuarios[0].documento=${SGA_ADMIN_DOCUMENTO}
sga.usuarios-iniciales.usuarios[0].fecha-nacimiento=${SGA_ADMIN_FECHA_NACIMIENTO}
sga.usuarios-iniciales.usuarios[0].rol=ADMINISTRADOR

# Cuentas iniciales de la recepción y del personal de servicio, también desde variables de entorno
sga.usuarios-iniciales.usuarios[1].nombre=${SGA_RECEPCION_NOMBRE}
sga.usuarios-iniciales.usuarios[1].correo=${SGA_RECEPCION_CORREO}
sga.usuarios-iniciales.usuarios[1].contrasena=${SGA_RECEPCION_CONTRASENA}
sga.usuarios-iniciales.usuarios[1].telefono=${SGA_RECEPCION_TELEFONO}
sga.usuarios-iniciales.usuarios[1].documento=${SGA_RECEPCION_DOCUMENTO}
sga.usuarios-iniciales.usuarios[1].fecha-nacimiento=${SGA_RECEPCION_FECHA_NACIMIENTO}
sga.usuarios-iniciales.usuarios[1].rol=RECEPCIONISTA
sga.usuarios-iniciales.usuarios[2].nombre=${SGA_SERVICIO_NOMBRE}
sga.usuarios-iniciales.usuarios[2].correo=${SGA_SERVICIO_CORREO}
sga.usuarios-iniciales.usuarios[2].contrasena=${SGA_SERVICIO_CONTRASENA}
sga.usuarios-iniciales.usuarios[2].telefono=${SGA_SERVICIO_TELEFONO}
sga.usuarios-iniciales.usuarios[2].documento=${SGA_SERVICIO_DOCUMENTO}
sga.usuarios-iniciales.usuarios[2].fecha-nacimiento=${SGA_SERVICIO_FECHA_NACIMIENTO}
sga.usuarios-iniciales.usuarios[2].rol=PERSONAL_SERVICIO
